# The enhancement configuration an agent run must exercise.
#
# WHY THIS FILE EXISTS. tools/drive.py used to default PSXPORT_SETTINGS at
# scratch/spyro-runtime/settings.ini, which does not exist, so every driven run fell back to product
# defaults with fps60 and widescreen OFF. Measured 2026-09-19: the whole body of green Spyro
# evidence, the 477-field Artisans oracle match included, was collected with the two features this
# project's goal is about switched off. The logs said so on every run; nothing read them.
#
# These are the two enhancements under test, and nothing else: every other knob is left at the
# product default on purpose, so a gate exercises the shipping path rather than one operator's
# preferences. A run that wants a different configuration passes --settings explicitly.
aspect=3
fps60=1
