# The enhancement configuration an agent run must exercise.
#
# WHY THIS FILE EXISTS. tools/drive.py used to default PSXPORT_SETTINGS at
# scratch/spyro-runtime/settings.ini, which does not exist, so every driven run fell back to product
# defaults with fps60 and widescreen OFF. Measured 2026-09-19: the whole body of green Spyro
# evidence, the 477-field Artisans oracle match included, was collected with the two features this
# project's goal is about switched off. The logs said so on every run; nothing read them.
#
# AND WHY aspect IS 1 AND NOT 3. It said 3 -- ASPECT_AUTO -- until 2026-09-20, and AUTO resolves to
# the SINK's aspect. An agent run is headless, so it has no wide sink and AUTO resolves to 4:3: the
# product printed `aspect=3 wide_engine=1 native_width=512 render_width=512` and captured 512x240,
# while the same run at aspect=1 printed `render_width=684` and captured 684x240. wide_engine=1 on
# both, which is exactly why psxport's picture_announce says to read render_width and not that flag.
# So the second body of "enhancements on" evidence -- Spyro's 14/14 and Tomba! 2's 34/34 checkpoints
# byte-identical off versus on -- was collected with widescreen off too, in a different disguise: the
# file reached the product this time, and its value meant "decide later" to a run with nothing to
# decide from. An agent gate cannot use AUTO; it must name the aspect it is testing.
#
# These are the two enhancements under test, and nothing else: every other knob is left at the
# product default on purpose, so a gate exercises the shipping path rather than one operator's
# preferences. A run that wants a different configuration passes --settings explicitly.
aspect=1
fps60=1
