# The configuration a PICTURE comparison against the console reference has to run under.
#
# tools/picture_oracle.py photographs the product and psxport's Beetle full-console reference at the
# same title-owned state and counts differing pixels. The reference is a PSX: 4:3, one presented
# frame per guest frame. Both enhancements change the frame the product hands the comparator:
#
#   aspect=3 renders the wider viewport, so the product presents a DIFFERENT SIZE and picture.py
#     refuses rather than scale one onto the other (scaling would invent the pixels it then
#     measured). Widescreen is not measured by hiding it here -- it is measured as a state question
#     by tools/oracle_compare.py, which found 14/14 checkpoints byte-identical with it off and on.
#   fps60=1 presents interpolated frames between guest frames, so the shutter can land on a frame
#     that no guest state corresponds to and the console never produced.
#
# So this file is not "the enhancements turned off to make a number look good": it is the only
# configuration in which the pixel question is answerable at all. tools/shipping_settings.ini is the
# configuration everything else runs under.
aspect=0
fps60=0
